"linkedin\",\"LinkedIn\",\"Mapa do Site\",{\"_642\":643,\"_644\":645,\"_646\":647,\"_648\":649,\"_650\":651,\"_652\":653,\"_654\":655},\"aboutPalver\",\"A Palver\",\"products\",\"Nossos Produtos\",\"survey\",\"Palver Pesquisa\",\"differentials\",\"O que fazemos melhor\",\"trust\",\"Confiam na Palver\",\"faq\",\"FAQ - Perguntas Frequentes\",\"privacyPolicy\",\"Política de Privacidade\",\"Pronto para elevar sua estratégia de dados?\",\"items\",[659,660,661,662,663],{\"_385\":677,\"_665\":678,\"_74\":679},{\"_385\":674,\"_665\":675,\"_74\":676},{\"_385\":671,\"_665\":672,\"_74\":673},{\"_385\":668,\"_665\":669,\"_74\":670},{\"_385\":664,\"_665\":666,\"_74\":667},\"faq-6\",\"question\",\"Como a Palver ajuda em monitoramento e gerenciamento de crise?\",\"Painéis com consultas direcionadas, classificações automatizadas para priorizar o que é sensível e alertas para reação mais rápida. A Palver fornece uma visão contínua do que está sendo dito, onde e por quem, com histórico e material completo para te ajudar a acompanhar a formação de opinião, criação de narrativas e tendências em tempo real.\",\"faq-5\",\"Quem pode usar o Palver Clipping e o Palver Studio?\",\"Times de comunicação e marketing, assessorias de imprensa, agências, órgãos e instituições, equipes de jornalismo e pesquisa, áreas de insights e qualquer um interessado em monitoramento de crise e opinião pública.\",\"faq-3\",\"Qual a diferença entre Palver Clipping e Palver Studio?\",\"O Clipping é forte no recorte editorial, com painéis focados em monitoramento e distribuição do que foi publicado. O Studio é a ferramenta de análise e exploração ampla de dados sociais + mídia tradicional, para visualizar e operacionalizar dados em escala.\",\"faq-2\",\"O que é social listening?\",\"Social listening é a prática de captar, organizar e interpretar conversas e menções em redes sociais e outros canais digitais públicos, para entender volume, tom, narrativas, influenciadores e tendências. No ecossistema Palver, exploramos e interagimos com dados de redes sociais e mídia tradicional.\",\"faq-1\",\"O que é clipping de mídia (e o que é o Palver Clipping)?\",\"Clipping de mídia é o acompanhamento sistemático do que veículos publicam ou transmitem sobre temas, marcas, pessoas ou concorrentes. Ele agrega informações de jornais, revistas, portais, rádio e TV, além de conteúdos agregados em fluxos de notícias. O Palver Clipping organiza isso em painéis de recorte: você define consultas, veículos, fontes e localizações para monitorar o que importa, classificar conteúdos com a curadoria, ver gráficos, gerar alertas e muito mais.\",\"Algumas das empresas e instituições que confiam no trabalho da Palver:\",\"carouselAriaLabel\",\"Carrossel de logos de parceiros\",\"carouselNextAriaLabel\",\"Próximo slide\",\"carouselPreviousAriaLabel\",\"Slide anterior\",\"lead\",\"Transformamos conversas públicas em alertas, relatórios e insights acionáveis para comunicação, reputação, pesquisa e estratégia.\",\"body\",\"Unimos mídia tradicional e digital em uma infraestrutura contínua de coleta e análise: do clipping ao social listening, com transcrição, painéis e APIs. Sua equipe acompanha narrativas, volume e contexto em um só lugar, com dados confiáveis para decidir com agilidade.\",\"Diferenciais\",\"As soluções da Palver contam com diferenciais:\",\"cards\",[695,696,697,698,699,700,701,702],{\"_385\":724,\"_439\":725,\"_457\":726},{\"_385\":721,\"_439\":722,\"_457\":723},{\"_385\":718,\"_439\":719,\"_457\":720},{\"_385\":715,\"_439\":716,\"_457\":717},{\"_385\":712,\"_439\":713,\"_457\":714},{\"_385\":709,\"_439\":710,\"_457\":711},{\"_385\":706,\"_439\":707,\"_457\":708},{\"_385\":703,\"_439\":704,\"_457\":705},\"termComparison\",\"Comparação\",\"Compare palavras e acompanhe o desempenho de termos importantes.\",\"history\",\"Histórico\",\"Veja o histórico de menções à sua organização e termos importantes.\",\"realTimeData\",\"Dados e Processamento\",\"Acesse os dados e conteúdos atualizados diariame isa encontrada\",\"resultsCount_other\",\"{{count}} pesquisas encontradas\",\"emptyState\",\"Nenhuma pesquisa encontrada para os filtros selecionados.\",\"paginationAriaLabel\",\"Paginação das pesquisas\",\"downloadPressRelease\",\"Baixar o Press Release\",\"downloadReport\",\"Baixar o Relatório\",{\"_813\":814,\"_815\":816,\"_817\":818,\"_819\":820,\"_821\":822,\"_823\":824,\"_825\":826,\"_827\":828},\"voting-intention-2026-august\",{\"_439\":837,\"_457\":830},\"voting-intention-2026-september-w2-v1\",{\"_439\":836,\"_457\":830},\"voting-intention-2026-september-w2-v2\",{\"_439\":835,\"_457\":830},\"voting-intention-2026-september-w3\",{\"_439\":834,\"_457\":830},\"voting-intention-2026-september-w4\",{\"_439\":833,\"_457\":830},\"voting-intention-2026-september-w5\",{\"_439\":832,\"_457\":830},\"voting-intention-2026-october-w6\",{\"_439\":831,\"_457\":830},\"voting-intention-2026-october-w7\",{\"_439\":829,\"_457\":830},\"Eleições Presidenciais 2026: Intenção de Voto | Outubro/2026 | W7\",\"Intenção de voto do eleitorado brasileiro para a Presidência da República, com recorte por região, faixa etária e renda.\",\"Eleições Presidenciais 2026: Intenção de Voto | Outubro/2026 | W6\",\"Eleições Presidenciais 2026: Intenção de Voto | Setembro/2026 | W5\",\"Eleições Presidenciais 2026: Intenção de Voto | Setembro/2026 | W4\",\"Eleições Presidenciais 2026: Intenção de Voto | Setembro/2026 | W3\",\"Eleições Presidenciais 2026: Intenção de Voto | Setembro/2026 | W2/V2\",\"Eleições Presidenciais 2026: Intenção de Voto | Setembro/2026 | W2/V1\",\"Eleições Presidenciais 2026: Intenção de Voto | Agosto/2026\",\"all\",\"Todas as pesquisas\",\"elections-2026\",\"government-approval\",\"Avaliação de Governo\",\"public-opinion\",\"Opinião Pública\",\"Método\",\"paragraphs\",[848,849,850],\"A Pesquisa Palver adota o formato de pesquisa digital com recrutamento via anúncios na internet, distribuídos dentro de cotas demográficas pré-definidas por região, gênero e faixa etária. Esse direcionamento por cotas garante cobertura mínima de subgrupos críticos da população sem comprometer o recrutamento dentro de cada estrato.\",\"Para garantir a integridade da amostra, o sistema Palver utiliza validação por evidência de IP e cookie digital, assegurando que apenas pessoas físicas respondam ao questionário. O link de acesso é individual e intransferível, impedindo compartilhamento ou duplicação de respostas. A coleta conta com sistema antirrobô que identifica e impede automaticamente submissões geradas por robôs ou preenchimentos automatizados.\",\"A correção dos vieses de seleção é feita a partir do modelo de Raking (Iterative Proportional Fitting), método de calibração que ajusta iterativamente os pesos amostrais até que as distribuições marginais da amostra coincidam com as da população-alvo. As variáveis de calibração incluem sexo, faixa etária, região, renda per capita domiciliar e voto no segundo turno de 2022, com targets extraídos da PNAD Contínua e dos resultados oficiais do TSE.\",\"Pesquisa\",\"Acompanhe o resultado de pesquisas públicas com um relatório completo feito pelo nosso time de análise.\",\"Palver Pesquisa | Pesquisas de opinião pública\",\"ariaLabel\",\"Ir para Home\",\"Navegação principal\",\"languageSwitcherAriaLabel\",\"Selecionar idioma\",{\"_642\":864,\"_646\":851,\"_865\":866,\"_867\":727,\"_868\":869,\"_870\":871,\"_431\":872,\"_553\":873,\"_654\":655,\"_874\":875,\"_876\":877},\"buttons\",{\"_862\":863},\"scheduleDemo\",\"Agende uma demo\",\"Conheça a Palver\",\"insights\",\"Insights\",\"solutions\",\"media\",\"Palver na Mídia\",\"plans\",\"Planos\",\"Home\",\"Contato\",\"login\",\"Login\",\"logout\",\"Sair\",\"ENV\",{\"_881\":882,\"_883\":562,\"_884\":885,\"_886\":885,\"_887\":885,\"_888\":889,\"_890\":891,\"_892\":893,\"_894\":895,\"_896\":897,\"_898\":899,\"_900\":901},\"user\",\"VITE_RECAPTCHA_SITE_KEY\",\"6Ld-LjQrAAAAABZdC05QxnbPUnNoLQODoQ6bprZY\",\"EMAIL_RECIPIENT\",\"LOGIN_URL\",\"https://www.palver.com\",\"SITE_URL
