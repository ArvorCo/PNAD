name: Totalizacao paralela (exportacao publica)

# Le as views publicas do Supabase com a chave publicavel (nenhum segredo), grava os agregados e
# o CSV de reproducao em docs/assets/totalizacao_dados/ e publica no Pages. Cada commit fixa um
# snapshot auditavel da cadeia de hashes no historico do git.
on:
  schedule:
    # A cada 10 minutos de 25/10 a 15/11 (UTC), porque os envios seguem chegando depois do
    # 2o turno; fora disso, so manual. Cron nao atravessa meses: uma linha por mes.
    - cron: '*/10 * 25-31 10 *'
    - cron: '*/10 * 1-15 11 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: totalizacao-exportacao
  cancel-in-progress: false

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python3 -m pip install -q "asn1tools>=0.169.0"
      - name: Conferir BUs aceitos com o BU publicado pelo TSE
        run: python3 scripts/totalizacao-conferir-tse.py
      - name: Exportar agregados e CSV
        run: python3 scripts/totalizacao-exportar.py
      - name: Commitar snapshot se houver mudanca
        id: commit
        run: |
          git config user.name "totalizacao-bot"
          git config user.email "totalizacao-bot@users.noreply.github.com"
          git add docs/assets/totalizacao_dados
          if git diff --cached --quiet; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "totalizacao: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
            # A main recebe pushes de outras sessões a cada poucos minutos: o push pode ser
            # rejeitado entre o pull e o envio. Tenta de novo, rebaseando sobre a main atual.
            for tentativa in 1 2 3 4 5; do
              git pull --rebase origin main && git push && break
              echo "push rejeitado (tentativa $tentativa); aguardando"; sleep $((tentativa * 10))
            done
            echo "mudou=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar no Pages
        if: steps.commit.outputs.mudou == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
