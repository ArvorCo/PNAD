name: Publish GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Fetch public documents from Git LFS
        run: git lfs pull --include="docs/**"
      - name: Verify documents contain PDF bytes, not LFS pointers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          documents = list(Path('docs').rglob('*.pdf'))
          for path in documents:
              with path.open('rb') as handle:
                  assert handle.read(5) == b'%PDF-', f'Invalid public PDF: {path}'
          print(f'{len(documents)} public PDF files verified')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
